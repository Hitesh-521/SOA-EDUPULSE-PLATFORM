server:
  port: 8083

spring:
  application:
    name: attendance-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/attendance_db
    username: ${DB_USER:postgres}
    password: "${DB_PASSWORD:Hitu2007@}"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:eduPulseSuperSecretKeyForJWTSigningMinimum256BitsLongForHS256}